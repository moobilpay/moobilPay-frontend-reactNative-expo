# Build Android de production compile SUR LE RUNNER GitHub (`eas build --local`),
# sans la file d'attente gratuite d'Expo, puis envoi direct sur le Play Store.
# Expo ne sert qu'a fournir le keystore et le versionCode (appVersionSource
# remote + autoIncrement) : rien a commiter apres un build.
#
# Prerequis (Settings > Secrets and variables > Actions) :
# - `EXPO_TOKEN` : jeton expo.dev > Account Settings > Access Tokens.
# - `GOOGLE_PLAY_SERVICE_ACCOUNT_JSON` : contenu du JSON du compte de service
#   Google Play (le meme que celui utilise par `eas submit`).
#
# La branche a builder se choisit dans « Use workflow from » (Run workflow).
name: Android Release

on:
  workflow_dispatch:
    inputs:
      track:
        description: Piste Play Store
        type: choice
        options: [production, beta, alpha, internal]
        default: production
      status:
        description: "Statut de la release (draft obligatoire tant que l'app n'a jamais ete publiee sur Play)"
        type: choice
        options: [completed, draft]
        default: completed
      release_notes:
        description: "Notes de version Play Store (« Nouveautés », 500 car. max, \\n = retour à la ligne). Vide = aucune note"
        type: string
        required: false
      notes_language:
        description: Langue des notes (doit exister dans la fiche Play Store)
        type: string
        default: fr-FR
      send_for_review:
        description: "Envoyer pour examen a Google (decoche = a envoyer manuellement depuis Play Console ; refuse par Play apres un rejet)"
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # `packager: npm` : yarn est absent des runners ubuntu recents.
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          packager: npm
          token: ${{ secrets.EXPO_TOKEN }}

      - run: npm ci

      # Le gradle.properties du HOME prime sur celui du projet genere :
      # - memoire : 2 Go par defaut → OutOfMemoryError Metaspace sur R8 ;
      # - ABIs : on garde x86/x86_64 car les testeurs Play utilisent des
      #   emulateurs ; sans eux l'app crashe au lancement (libs natives absentes).
      - run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx8g -XX:MaxMetaspaceSize=2g -XX:+HeapDumpOnOutOfMemoryError" >> ~/.gradle/gradle.properties
          echo "reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64" >> ~/.gradle/gradle.properties

      # Le profil `production` charge les variables EAS `production`
      # (EXPO_PUBLIC_*), `.env` etant absent du runner.
      - run: eas build --platform android --profile production --local --non-interactive --output app.aab

      - uses: actions/upload-artifact@v4
        with:
          name: app-aab
          path: app.aab

      # Fichier whatsnew-<langue> lu par l'action Play. Les notes passent par
      # env (et non ${{ }} dans le script) pour qu'aucun caractere ne soit
      # interprete par le shell.
      - if: inputs.release_notes != ''
        env:
          NOTES: ${{ inputs.release_notes }}
          NOTES_LANG: ${{ inputs.notes_language }}
        run: |
          mkdir -p whatsnew
          printf '%s' "$NOTES" | sed 's/\\n/\n/g' > "whatsnew/whatsnew-$NOTES_LANG"
          cat "whatsnew/whatsnew-$NOTES_LANG"

      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.moobilpay.com
          releaseFiles: app.aab
          track: ${{ inputs.track }}
          status: ${{ inputs.status }}
          whatsNewDirectory: ${{ inputs.release_notes != '' && 'whatsnew' || '' }}
          # Decoche : envoi en examen manuel depuis Play Console > Apercu de la publication.
          changesNotSentForReview: ${{ !inputs.send_for_review }}
